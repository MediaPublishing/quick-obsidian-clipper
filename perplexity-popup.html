<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 420px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #7c3aed;
      font-size: 16px;
    }
    .instructions {
      background: #f3f4f6;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .instructions p {
      margin: 0;
    }
    .url-display {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #6b7280;
      word-break: break-all;
    }
    .url-label {
      font-weight: 500;
      color: #374151;
      margin-bottom: 2px;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #7c3aed;
      color: white;
    }
    .btn-primary:hover {
      background: #6d28d9;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }
    .btn-secondary:hover {
      background: #d1d5db;
    }
    .status {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }
    .status.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }
    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }
    textarea {
      width: 100%;
      height: 180px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: #7c3aed;
    }
  </style>
</head>
<body>
  <h3>Clip Perplexity Search</h3>

  <div class="instructions">
    <p>Select and copy the text, or click the <strong>"Copy"</strong> button at the bottom of your Perplexity answer.</p>
  </div>

  <div class="url-display">
    <div class="url-label">URL:</div>
    <div id="pageUrl">Loading...</div>
  </div>

  <textarea id="content" placeholder="Paste Perplexity content here (Cmd+V / Ctrl+V)..."></textarea>

  <button id="clipFromClipboard" class="btn btn-primary">Clip from Clipboard</button>
  <button id="clipFromTextarea" class="btn btn-secondary">Clip Pasted Content</button>

  <div id="status" class="status"></div>

  <script src="perplexity-popup.js"></script>
</body>
</html>
